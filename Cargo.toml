[package]
name = "sparkstage"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Local-first production control plane for agent-authored video projects"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
fs4 = "0.13"
futures-util = "0.3.34"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "query", "rustls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
signal-hook = "0.3.18"
tar = "0.4"
thiserror = "2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "url"] }
ulid = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
